# Worker environment for the formal-verification loop.
#
# Workers need the Python package plus an oss-cad-suite install providing
# yosys, sby and the SMT solvers. The solvers are invoked as subprocesses, so
# they must be on PATH on every node that advertises the "formal" resource --
# a worker without them will fail every task it is handed, and the loop will
# read that as a design that cannot be elaborated.
name: chia_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - ray[default]==2.54.0
      - google-genai>=1.64.0
      - pydantic==2.12.4
      - pyyaml==6.0.3
